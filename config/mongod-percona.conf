# Percona Server for MongoDB — validation config for issue #41. Mirrors
# config/mongod.conf (the MongoDB Community variant) but uses Percona's
# documented setParameter set (confirmed against a real run — see
# docs/validation/percona-search-validation.md):
#   https://docs.percona.com/percona-search-for-mongodb/install-mongot.html
#
# skipAuthenticationToSearchIndexManagementServer and searchTLSMode are
# Percona-specific and don't exist on official MongoDB Community mongod (see
# #29) — that's the actual, confirmed difference between the two backends'
# configs, not the stale claim the old config/mongod.conf header used to make.
storage:
  dbPath: /data/db
net:
  port: 27017
  bindIpAll: true
setParameter:
  mongotHost: mongot-percona.warden-net-percona:27028
  searchIndexManagementHostAndPort: mongot-percona.warden-net-percona:27028
  skipAuthenticationToSearchIndexManagementServer: false
  useGrpcForSearch: true
  searchTLSMode: disabled
replication:
  replSetName: rs0
# Single-node replica set for this validation spike (the bundled MongoDB
# Community stack runs a 3-node HA set — see docker-compose.mongodb.yml).
# mongot only requires membership in a replica set for its oplog tailing, not
# a specific member count, so a single node is sufficient to validate search
# behavior without the extra resource/time cost of standing up three nodes.
# Runs without auth, matching the bundled Community stack's default posture.
