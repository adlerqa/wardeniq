name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Fast, fully-mocked tests: unit tests + the API/RBAC suites that drive the
  # real FastAPI app + auth_gateway middleware through TestClient, but never
  # touch a real MongoDB (Store.get_settings / store.add_audit are stubbed —
  # see tests/conftest.py and tests/test_api_routes.py).
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt -r app/requirements-dev.txt

      - name: Lint (informational)
        # Existing app modules are not lint-clean yet; surface issues without
        # blocking the build. Tighten to a hard gate once the code is cleaned.
        continue-on-error: true
        run: ruff check app tests

      - name: Type check (informational)
        # app/ isn't annotated consistently yet (~25 errors as of writing, in
        # sheet_import.py / testgen/service.py / email_send.py / validator.py).
        # Surfaced for visibility; not a merge gate until those are fixed.
        continue-on-error: true
        run: mypy app --ignore-missing-imports

      - name: Run unit + API + RBAC tests
        run: pytest -m "not dbintegration"

      - name: Evaluation harness gate (deterministic, no model/database needed)
        # tests/test_eval_harness.py (part of the pytest run above) already exercises
        # this same logic; this step additionally proves the documented CLI entry
        # point itself (see docs/architecture.md) works end-to-end and is a real merge
        # gate — issue #42's original "wire the leakage and groundedness checks into
        # CI as regression gates". Only the offline sections (adversarial grounding
        # probes + dedup pairs) run here: no LLM call, no database, expected to score
        # 1.0. --coverage (needs a real, reachable LLM) is deliberately NOT run in CI —
        # see docs/architecture.md's "Measuring accuracy" section — and stays a manual/
        # on-demand benchmark, not a merge gate.
        run: python -m tests.eval.run_eval --probes --dedup

  # Same store.py surface, but against a real MongoDB — catches things the
  # mocked unit tests structurally can't (real unique-index violations, actual
  # query/update behavior, ObjectId edge cases, encrypted-settings round trip).
  #
  # Uses a single standalone `mongo` container (no mongot / Atlas Search), so
  # vectorSearch-backed store.py methods are out of scope here — Store.ensure_
  # indexes() is expected to fail partway through on those, which
  # tests/test_db_integration.py tolerates. Full vector-search coverage needs
  # the real docker-compose stack (PSMDB + mongot) and is a manual/deployment
  # verification step, not a CI one, per CLAUDE.md's architecture notes.
  db-integration-tests:
    runs-on: ubuntu-latest
    # A healthy run takes ~1 minute; this job has stalled for 8-14 minutes on some runs. Fail fast
    # instead of burning the default 6 hours, and let the diagnostics step below explain why.
    timeout-minutes: 8
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt -r app/requirements-dev.txt

      - name: Run DB integration tests
        env:
          MONGO_TEST_URI: mongodb://localhost:27017
        # -o addopts="" drops pytest.ini's -q so -v really prints each test name as it starts (the
        # last name in a stalled run is the stuck test); faulthandler_timeout dumps every thread's
        # stack once a single test exceeds 90s, which shows exactly where it is blocked.
        run: pytest -m dbintegration -v -o addopts="" -o faulthandler_timeout=90 --durations=10

      - name: Diagnostics (runner + mongo service state)
        if: failure() || cancelled()
        run: |
          date -u; uptime; free -m; df -h / | tail -1
          docker ps -a
          for c in $(docker ps -aq); do
            docker inspect -f '--- {{.Name}} status={{.State.Status}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}}' "$c"
            docker logs --tail 80 "$c" 2>&1 | cut -c1-300
          done
          docker stats --no-stream || true
          sudo dmesg 2>/dev/null | tail -30 || true

  # frontend/package.json defines test/lint/check scripts; nothing ran them in
  # CI before this job, so a regression in frontend/src or frontend/tests
  # could merge green. Node version matches the app/Dockerfile build stage
  # (node:20-slim) so this catches the same failures that stage would hit.
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Lint
        working-directory: frontend
        run: npm run lint

  # Flags dependencies with known CVEs. Informational: some transitive deps
  # (e.g. boto3's own dependency tree) may carry advisories with no upstream
  # fix yet, so this doesn't block merges — but it's visible in every run.
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: Audit dependencies (informational)
        continue-on-error: true
        run: pip-audit -r app/requirements.txt -r app/requirements-dev.txt

  # Confirms the shipped image (frontend build + FastAPI app) still builds,
  # and that the compose files are valid — independent of the app-level unit
  # tests, since neither exercises the Dockerfile/compose config.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose configuration
        run: docker compose config --quiet

      - name: Build app image
        run: docker build -f app/Dockerfile -t wardeniq-app:ci .
